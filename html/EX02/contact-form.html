<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Character encoding - MUST be first -->
    <meta charset="UTF-8">

    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta description for search engines -->
    <meta name="description" content="Contact Acme Support. Send us a message and we will get back to you.">

    <!-- Page title (shown in browser tab) -->
    <title>Contact Us - Acme Support</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }

        /* Header / Site branding */
        header {
            background: #fff;
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #000;
            margin-bottom: 2rem;
        }

        .site-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        /* Navigation */
        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #667eea;
        }

        /* Main content */
        main {
            max-width: 500px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* Form heading */
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .form-description {
            color: #666;
            margin-bottom: 1.5rem;
        }

        /* Form */
        form {
            background: #fff;
            padding: 2rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Form group - wraps label and input -->
    .form-group {
      margin-bottom: 1.5rem;
    }
    
    /* Labels */
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #333;
        }

        /* Text inputs and select */
        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Textarea */
        textarea {
            resize: vertical;
            min-height: 150px;
        }

        /* Fieldset: Groups related form controls -->
    fieldset {
      border: none;
      padding: 0;
      margin: 0;
      margin-bottom: 1.5rem;
    }
    
    /* Legend: Accessible label for fieldset -->
    legend {
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #333;
      padding: 0;
    }
    
    /* Radio and checkbox styling */
        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        input[type="radio"]+label,
        input[type="checkbox"]+label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        /* Submit button */
        button[type="submit"] {
            background: #333;
            color: #fff;
            padding: 0.75rem 1.5rem;
            font-size: 16px;
            font-weight: 600;
            border: 1px solid #333;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        button[type="submit"]:hover {
            background: #555;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        /* Footer */
        footer {
            background: #fff;
            padding: 1.5rem 2rem;
            border-top: 2px solid #000;
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: 2rem;
        }

        /* Horizontal line separator */
        hr {
            border: none;
            border-top: 2px solid #000;
            margin: 2rem 0;
        }
    </style>
</head>

<body>
    <!-- PAGE HEADER: Site branding and navigation -->
    <header>
        <h1 class="site-title">Acme Support</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#help">Help</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <hr>

    <!-- MAIN CONTENT: Primary page content -->
    <main>
        <!-- Page heading -->
        <h1>Contact us</h1>
        <p class="form-description">Send us a message and we will get back to you.</p>

        <!-- FORM ELEMENT: Wraps all form controls -->
        <!-- action: Where the form data is sent (placeholder URL) -->
        <!-- method: HTTP method (POST sends data in body, GET in URL) -->
        <form action="/api/contact" method="post">

            <!-- TEXT INPUT: Full name field -->
            <div class="form-group">
                <!-- LABEL: Associated with input by for/id -->
                <!-- for attribute matches input's id -->
                <label for="fullName">Full name</label>
                <!-- INPUT: Text field -->
                <!-- id matches label's for attribute -->
                <!-- required: Browser validation - user must fill this -->
                <!-- name: Key sent to server ("fullName": "John Smith") -->
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <!-- EMAIL INPUT: Email field -->
            <div class="form-group">
                <!-- LABEL: Paired with input -->
                <label for="email">Email</label>
                <!-- INPUT type="email": Browser validates email format -->
                <!-- required: User must fill this field -->
                <!-- name: Key sent to server ("email": "user@example.com") -->
                <input type="email" id="email" name="email" required>
            </div>

            <!-- SELECT: Subject dropdown -->
            <div class="form-group">
                <!-- LABEL: Associated with select -->
                <label for="subject">Subject</label>
                <!-- SELECT: Dropdown menu -->
                <!-- id matches label's for attribute -->
                <!-- name: Key sent to server ("subject": "billing") -->
                <select id="subject" name="subject">
                    <!-- OPTION: First option is often a placeholder -->
                    <option value="">Choose a topic</option>
                    <!-- OPTION: Real options with values -->
                    <option value="billing">Billing</option>
                    <option value="technical">Technical Support</option>
                    <option value="general">General Inquiry</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <!-- TEXTAREA: Message field -->
            <div class="form-group">
                <!-- LABEL: Associated with textarea -->
                <label for="message">Message</label>
                <!-- TEXTAREA: Multi-line text field -->
                <!-- id matches label's for attribute -->
                <!-- name: Key sent to server ("message": "...") -->
                <!-- minlength="10": Requires at least 10 characters -->
                <!-- required: User must fill this field -->
                <textarea id="message" name="message" required minlength="10"></textarea>
            </div>

            <!-- FIELDSET: Groups related radio buttons -->
            <!-- Groups related form controls for accessibility -->
            <fieldset>
                <!-- LEGEND: Accessible label for the fieldset -->
                <!-- Screen readers announce this when entering fieldset -->
                <legend>How did you hear about us?</legend>

                <!-- RADIO GROUP: Only one can be selected -->
                <div class="radio-group">

                    <!-- RADIO OPTION 1 -->
                    <div class="radio-option">
                        <!-- INPUT type="radio": Mutually exclusive option -->
                        <!-- name: Same for all options in the group -->
                        <!-- value: Sent to server ("source": "search") -->
                        <!-- id: Paired with label for attribute -->
                        <input type="radio" id="source-search" name="source" value="search">
                        <!-- LABEL: Associated with radio button -->
                        <label for="source-search">Search</label>
                    </div>

                    <!-- RADIO OPTION 2 -->
                    <div class="radio-option">
                        <input type="radio" id="source-friend" name="source" value="friend">
                        <label for="source-friend">Friend</label>
                    </div>

                    <!-- RADIO OPTION 3 -->
                    <div class="radio-option">
                        <input type="radio" id="source-social" name="source" value="social-media">
                        <label for="source-social">Social media</label>
                    </div>
                </div>
            </fieldset>

            <!-- CHECKBOX: Optional newsletter signup -->
            <div class="form-group">
                <div class="checkbox-group">
                    <!-- CHECKBOX: Can be checked or unchecked -->
                    <!-- value: Sent only if checked ("newsletter": "yes") -->
                    <!-- name: Key sent to server -->
                    <!-- id: Paired with label -->
                    <div class="checkbox-option">
                        <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                        <!-- LABEL: Associated with checkbox -->
                        <label for="newsletter">Send me product updates</label>
                    </div>
                </div>
            </div>

            <!-- SUBMIT BUTTON: Sends the form -->
            <!-- type="submit": Triggers form submission -->
            <!-- Clear, descriptive text (not "Click here") -->
            <button type="submit">Send message</button>
        </form>
    </main>

    <hr>

    <!-- PAGE FOOTER: Copyright and closing information -->
    <footer>
        <p>&copy; 2026 Acme Support</p>
    </footer>
</body>

</html>
